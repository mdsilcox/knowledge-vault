[project]
name = "kv"
version = "0.1.0"
description = "Conventions, checker, sync hook and installer for a basic-memory knowledge vault"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that run real basic-memory (run with -m slow)",
    "gate: checks against the real seeded vault at the Build gate (needs KV_GATE_VAULT)",
]
addopts = "-m 'not slow and not gate'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kv"]
